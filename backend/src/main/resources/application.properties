spring.config.import=optional:file:.env[.properties]

spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/projeto_db}
spring.datasource.username=${DB_USERNAME:projeto_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

# Cria atendentes e conversas de exemplo quando o banco está vazio.
# Desative em produção com WXN_DADOS_DEMO=false.
wxn.dados-demo=${WXN_DADOS_DEMO:true}

# Integrações opcionais: mantenha as chaves em backend/.env ou no ambiente do servidor.
wxn.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
wxn.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
wxn.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
wxn.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
wxn.whatsapp.graph-version=${WHATSAPP_GRAPH_VERSION:v27.0}
wxn.groq.api-key=${GROQ_API_KEY:}
wxn.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
wxn.chatbot.faq=${WXN_FAQ:}
wxn.cors.allowed-origins=${WXN_CORS_ALLOWED_ORIGINS:http://localhost:3000}
